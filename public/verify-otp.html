
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify Phone | LIGTAS.AI</title>

    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/verify-otp.css">

    <script src="/js/verify-otp.js" defer></script>
</head>
<body>

    <main class="auth-container">
        <section class="auth-card otp-card">

            <div class="brand">
                <h1>LIGTAS<span>.AI</span></h1>
                <p>Account Security</p>
            </div>

            <div class="auth-heading otp-heading">
                <h2>Verify your phone</h2>
                <p>
                    Enter the 6-digit verification code sent to your
                    registered phone number.
                </p>
            </div>

            <form id="otpForm">
                <div class="form-group">
                    <label for="otp">Verification code</label>

                    <input
                        type="text"
                        id="otp"
                        name="otp"
                        placeholder="000000"
                        maxlength="6"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        pattern="[0-9]{6}"
                        required
                    >
                </div>

                <button
                    type="submit"
                    id="verifyButton"
                    class="auth-button"
                >
                    Verify phone number
                </button>
            </form>

            <div id="otpMessage" class="message"></div>

            <div class="resend-section">
                <p>Didn't receive the code?</p>

                <button
                    type="button"
                    id="resendButton"
                    class="resend-button"
                    disabled
                >
                    Resend code in <span id="countdown">60</span>s
                </button>
            </div>

            <div class="auth-footer">
                <a href="/login">Back to login</a>
            </div>

        </section>
    </main>

</body>
</html>
