
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | LIGTAS.AI</title>

    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/dashboard.css">

    <script src="/js/dashboard.js" defer></script>
</head>
<body>

    <main class="dashboard-container">

        <header class="dashboard-header">
            <div class="brand">
                <h1>LIGTAS<span>.AI</span></h1>
                <p>Account Security Platform</p>
            </div>

            <button type="button" id="logoutButton" class="logout-button">
                Log out
            </button>
        </header>

        <section class="dashboard-content">

            <div class="welcome-section">
                <p class="section-label">DASHBOARD</p>
                <h2>Welcome back, <span id="username">Loading...</span></h2>
                <p>Your account is successfully authenticated.</p>
            </div>

            <div class="dashboard-card">
                <h3>Account Information</h3>

                <div class="account-detail">
                    <span>Username</span>
                    <strong id="accountUsername">Loading...</strong>
                </div>

                <div class="account-detail">
                    <span>Email Address</span>
                    <strong id="accountEmail">Loading...</strong>
                </div>

                <div class="account-detail">
                    <span>Phone Number</span>
                    <strong id="accountPhone">Loading...</strong>
                </div>

                <div class="account-detail">
                    <span>Phone Verification</span>
                    <strong id="phoneStatus">Loading...</strong>
                </div>
            </div>

        </section>

        <footer class="page-footer">
            © 2026 LIGTAS.AI. All rights reserved.
        </footer>

    </main>

</body>
</html>
